name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check syntax
        run: deno check --no-lock settings.js background.js content.js popup.js silence-skip.js

      - name: Run tests
        run: deno test --allow-read --no-lock test/

      - name: Validate manifest
        run: deno eval --no-lock "JSON.parse(Deno.readTextFileSync('manifest.json'))"
